<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ChannelRecipe 20s</title>
<style>
@font-face { font-family: BG; src: url(fonts/bricolage-grotesque-latin-500-normal.woff2) format('woff2'); font-weight: 500; }
@font-face { font-family: BG; src: url(fonts/bricolage-grotesque-latin-700-normal.woff2) format('woff2'); font-weight: 700; }
@font-face { font-family: BG; src: url(fonts/bricolage-grotesque-latin-800-normal.woff2) format('woff2'); font-weight: 800; }
@font-face { font-family: JB; src: url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2'); font-weight: 400; }
@font-face { font-family: JB; src: url(fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2'); font-weight: 700; }
@font-face { font-family: JB; src: url(fonts/jetbrains-mono-latin-800-normal.woff2) format('woff2'); font-weight: 800; }
:root {
  --paper: #F3EFE6; --ink: #141414; --muted: #6F6A60; --line: #DDD7CA; --card: #FFFFFF;
  --accent: #6F5AE0; --accent-deep: #4B38B8; --money: #12B47A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #000; overflow: hidden; }
#scenes { position: absolute; inset: 0; perspective: 1900px; perspective-origin: 540px 960px; }
#stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; font-family: BG, sans-serif; color: var(--ink); transform-origin: 0 0; background: var(--paper); }
.sc { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 540px 730px; }
.rig { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
.o { position: absolute; left: 0; top: 0; transform-style: preserve-3d; transform-origin: 0 0; }
.x3 { position: relative; transform-style: preserve-3d; }
.x3 > .lay { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.d8 { font-weight: 800; letter-spacing: -0.045em; line-height: 0.9; white-space: nowrap; }
.d7 { font-weight: 700; letter-spacing: -0.03em; }
.mono { font-family: JB, monospace; }
.floor { position: absolute; left: 0; top: 0; width: 4400px; height: 4400px; transform-origin: 0 0;
  background-image: linear-gradient(rgba(111,90,224,.20) 3px, transparent 3px), linear-gradient(90deg, rgba(111,90,224,.20) 3px, transparent 3px);
  background-size: 200px 200px; }
.grain { position: absolute; left: -60px; top: -60px; width: 1200px; height: 2040px; pointer-events: none; mix-blend-mode: multiply; opacity: .09; z-index: 90; }

/* cards */
.card { width: 600px; height: 640px; background: var(--card); border-radius: 30px; position: relative; }
.card .thumb { position: absolute; left: 0; top: 0; width: 600px; height: 338px; border-radius: 30px 30px 0 0; overflow: hidden; }
.card .thumb > .art { position: absolute; left: 0; top: 0; width: 914px; height: 514px; transform: scale(.6565); transform-origin: 0 0; }
.card .title { position: absolute; left: 34px; top: 368px; font-size: 52px; }
.card .desc { position: absolute; left: 34px; top: 440px; font-size: 30px; font-weight: 500; color: var(--muted); }
.card .meta { position: absolute; left: 34px; top: 560px; font-size: 28px; color: var(--muted); white-space: pre; }
.card .meta b { color: var(--money); }
.views { position: absolute; right: 16px; bottom: 16px; height: 50px; padding: 0 18px 0 14px; border-radius: 10px; background: rgba(20,20,20,.88); color: #fff; font: 700 26px JB; display: flex; align-items: center; gap: 10px; }
.cap { position: absolute; left: 0; right: 0; text-align: center; font-weight: 800; font-size: 46px; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.55); }
.pill { height: 80px; padding: 0 36px; border-radius: 40px; background: var(--accent); color: #fff; font: 800 36px JB; letter-spacing: .04em; display: flex; align-items: center; white-space: nowrap; }
.ring { position: absolute; inset: -10px; border-radius: 38px; border: 10px solid var(--accent); }

/* panels */
.panel { width: 760px; height: 600px; background: var(--card); border-radius: 34px; position: relative; overflow: hidden; }
.panel .hd { position: absolute; left: 0; right: 0; top: 0; height: 92px; border-bottom: 3px solid var(--line); display: flex; align-items: center; gap: 18px; padding: 0 36px; font: 800 34px JB; }
.panel .hd i { width: 22px; height: 22px; border-radius: 50%; background: var(--line); display: inline-block; }
.panel .hd i:first-child { background: var(--accent); }
.typed { position: absolute; left: 40px; top: 130px; right: 40px; font: 700 34px/1.45 JB; white-space: pre-wrap; }
.typed .k { color: var(--accent); }
.wbar { position: absolute; bottom: 120px; width: 18px; border-radius: 9px; background: var(--accent); }
.track { position: absolute; left: 40px; right: 40px; height: 84px; border-radius: 14px; background: #F1EDE4; }
.clip { position: absolute; top: 8px; height: 68px; border-radius: 10px; }
.ph { position: absolute; top: 112px; width: 6px; height: 330px; background: #E5533D; border-radius: 3px; }

/* phone */
.phone { width: 440px; height: 900px; border-radius: 64px; background: #111; position: relative; }
.phone .scr { position: absolute; left: 18px; top: 18px; right: 18px; bottom: 18px; border-radius: 48px; background: #fff; overflow: hidden; }

/* captions */
#caps { position: absolute; left: 60px; right: 60px; top: 1236px; height: 220px; z-index: 60; display: flex; flex-wrap: wrap; align-content: flex-start; justify-content: center; gap: 4px 22px; }
#caps .w { font: 800 88px/1.08 BG; letter-spacing: -0.04em; position: relative; display: inline-block; padding: 0 10px; border-radius: 16px; }

/* avatar */
#av { position: absolute; left: 0; top: 0; width: 400px; height: 400px; z-index: 70; transform-origin: 200px 200px; transform-style: preserve-3d; }
#avWrap { position: absolute; inset: 0; perspective: 1200px; z-index: 70; pointer-events: none; }
#av svg { position: absolute; left: 0; top: -60px; width: 400px; height: 460px; overflow: visible; }
.disc { position: absolute; left: 10px; top: 10px; width: 380px; height: 380px; border-radius: 50%; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="o" style="width:1080px;height:1920px"></div>
  <div id="scenes"></div>
  <div id="caps"></div>
  <div id="avWrap"><div id="av"></div></div>
  <svg class="grain" id="grain" viewBox="0 0 1200 2040"><filter id="gn"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="11" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.4 -.2"/></filter><rect width="1200" height="2040" filter="url(#gn)"/></svg>
</div>
<script src="film.js"></script>
</body>
</html>
